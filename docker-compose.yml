services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: uzhavan-bazzar-backend:latest
    container_name: uzhavan-ml-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./ml/data:/app/ml/data
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    networks:
      - uzhavan-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: uzhavan-bazzar-frontend:latest
    container_name: uzhavan-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - uzhavan-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  uzhavan-network:
    driver: bridge
