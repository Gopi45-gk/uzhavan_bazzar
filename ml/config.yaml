# Global ML Configuration for Fruit & Vegetable Detection and Quality Grading

paths:
  fruit_dataset: "/home/gopikrishna/Documents/uzhavan bazzzar/dataset"
  vegetable_dataset: "/home/gopikrishna/Documents/uzhavan bazzzar/vegetable/Vegetable Images"
  processed_dir: "/home/gopikrishna/Documents/uzhavan bazzzar/ml/data"
  reports_dir: "/home/gopikrishna/Documents/uzhavan bazzzar/ml/reports"
  detection_model_dir: "/home/gopikrishna/Documents/uzhavan bazzzar/models/detection"
  quality_model_dir: "/home/gopikrishna/Documents/uzhavan bazzzar/models/quality"
  preprocessing_config: "/home/gopikrishna/Documents/uzhavan bazzzar/models/preprocessing/config.json"

hardware:
  device: "cuda:0"
  num_workers: 4
  mixed_precision: true

detection:
  base_model: "yolov8n.pt"  # Recommended for RTX 3050 4GB GPU
  imgsz: 320
  batch_size: 32
  epochs: 10
  patience: 4
  confidence_threshold: 0.35
  iou_threshold: 0.45

quality:
  architecture: "mobilenet_v3_large"  # Transfer learning from ImageNet
  imgsz: 224
  batch_size: 32
  epochs: 15
  learning_rate: 0.0005
  weight_decay: 0.0001
  patience: 4
  confidence_threshold: 0.40

grading:
  # Score 0 - 100 mapping to Grade A / B / C / D
  grades:
    A:
      min_score: 90
      max_score: 100
      description: "Excellent / Fresh"
    B:
      min_score: 75
      max_score: 89
      description: "Good / Standard Market Quality"
    C:
      min_score: 50
      max_score: 74
      description: "Average / Minor Surface Blemishes"
    D:
      min_score: 0
      max_score: 49
      description: "Poor / Damaged / Rotten"

mandi_api:
  base_url: "https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070"
  api_key: "579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b"
  default_state: "Tamil Nadu"
  default_district: "Chennai"

pricing_rules:
  default:
    A:
      min_offset: -5
      max_offset: 0
      description: "Top Tier: Full market rate to slight discount"
    B:
      min_offset: -10
      max_offset: -3
      description: "Standard Tier: Moderate discount for standard quality"
    C:
      max_offset: -10
      min_factor: 0.60
      description: "Economy Tier: Discounted rate for average quality"
    D:
      min_factor: 0.30
      max_factor: 0.50
      description: "Salvage Tier: Heavily discounted for processing/salvage"
  tomato:
    A:
      min_offset: -5
      max_offset: 0
    B:
      min_offset: -10
      max_offset: -3
    C:
      max_offset: -10
      min_factor: 0.60
    D:
      min_factor: 0.30
      max_factor: 0.50
  onion:
    A:
      min_offset: -6
