# Global ML Configuration for Fruit & Vegetable Detection and Quality Grading

paths:
  fruit_dataset: "dataset"
  vegetable_dataset: "vegetable/Vegetable Images"
  processed_dir: "ml/data"
  reports_dir: "ml/reports"
  detection_model_dir: "models/detection"
  quality_model_dir: "models/quality"
  preprocessing_config: "models/preprocessing/config.json"


hardware:
  device: "cuda:0"
  num_workers: 4
  mixed_precision: true

detection:
  base_model: "yolov8n.pt"  # Recommended for RTX 3050 4GB GPU
  imgsz: 320
  batch_size: 32
  epochs: 10
  patience: 4
  confidence_threshold: 0.35
  iou_threshold: 0.45

quality:
  architecture: "mobilenet_v3_large"  # Transfer learning from ImageNet
  imgsz: 224
  batch_size: 32
  epochs: 15
  learning_rate: 0.0005
  weight_decay: 0.0001
  patience: 4
  confidence_threshold: 0.40

grading:
  # Score 0 - 100 mapping strictly to Grade A / B / C
  grades:
    A:
      min_score: 90
      max_score: 100
      description: "Grade A"
    B:
      min_score: 75
      max_score: 89
      description: "Grade B"
    C:
      min_score: 0
      max_score: 74
      description: "Grade C"

fusion:
  weights:
    mean_score: 0.40
    minimum_score: 0.35
    confidence_score: 0.15
    consistency_score: 0.10
  damage_penalty_per_rotten_view: 5.0
  min_detection_confidence: 0.35
  min_quality_confidence: 0.40

mandi_api:
  base_url: "https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070"
  api_key: "579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b"
  default_state: "Tamil Nadu"
  default_district: "Chennai"

pricing_rules:
  default:
    A:
      min_offset: -5
      max_offset: 0
      description: "Grade A: BASE PRICE - ₹5 to BASE PRICE"
    B:
      min_offset: -10
      max_offset: -3
      description: "Grade B: BASE PRICE - ₹10 to BASE PRICE - ₹3"
    C:
      max_offset: -10
      description: "Grade C: Below BASE PRICE - ₹10"
  tomato:
    A:
      min_offset: -5
      max_offset: 0
    B:
      min_offset: -10
      max_offset: -3
    C:
      max_offset: -10
  onion:
    A:
      min_offset: -5
      max_offset: 0
    B:
      min_offset: -10
      max_offset: -3
    C:
      max_offset: -10
  potato:
    A:
      min_offset: -5
      max_offset: 0
    B:
      min_offset: -10
      max_offset: -3
    C:
      max_offset: -10

random_seed: 42

