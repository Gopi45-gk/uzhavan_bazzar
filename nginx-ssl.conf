# ==============================================================================
# Production Nginx Configuration with Let's Encrypt SSL
# Uzhavan Bazaar: Dynamic Mandi Pricing & AI Produce Quality Grading
# ==============================================================================

# HTTP Server — Automatically redirect all traffic to HTTPS & allow ACME challenges
server {
    listen 80;
    server_name uzhavan-bazzar.duckdns.org 54.66.139.31 _;

    # Allow Let's Encrypt automated challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic permanently to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server — High security SSL TLSv1.2 & TLSv1.3
server {
    listen 443 ssl;
    server_name uzhavan-bazzar.duckdns.org 54.66.139.31 _;

    ssl_certificate /etc/letsencrypt/live/uzhavan-bazzar.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzhavan-bazzar.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Maximum payload size for multi-view produce and livestock image uploads
    client_max_body_size 50M;

    # Gzip compression for high mobile responsiveness
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Cache immutable static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests directly to the FastAPI ML backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Proxy ML backend health check
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Single Page Application (SPA) fallback for React routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
